  <!-- Sets the slide direction for page transitions. It has to run before
       the page is first drawn, which is why it is here and not at the end. -->
  <script src="assets/js/motion.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main id="content">

    <!-- Page heading. The outer band spans the full width of the window so
         that dots.js can draw the dot grid behind it. -->
    <div class="dot-band" data-dots="papers">
      <section class="page-head container">
        <div>
          <h1>Papers</h1>
          <p class="page-lede">Conference papers, preprints and extended abstracts, newest first.</p>
        </div>
      </section>
    </div>

    <!-- One band per section of update/papers.json, rendered by papers.js. -->
    <div id="papers-sections">
      <p class="page-note container">Loading papers…</p>
    </div>

    <!-- Shown only when the list cannot render (fetch failure, no data) -->
    <p id="papers-note" class="page-note container" hidden></p>

  </main>
  <footer id="site-footer"></footer>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/papers.js"></script>
  <!-- The dot grid behind the page heading. Its on/off switches are at the
       top of the file. -->
  <script src="assets/js/dots.js"></script>
</body>
