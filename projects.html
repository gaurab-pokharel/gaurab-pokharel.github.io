<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects · Gaurab Pokharel</title>
  <meta name="description" content="Research projects by Gaurab Pokharel on AI, fairness and the allocation of scarce public resources." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Gaurab Pokharel" />
  <meta property="og:title" content="Projects · Gaurab Pokharel" />
  <meta property="og:description" content="Research projects by Gaurab Pokharel on AI, fairness and the allocation of scarce public resources." />
  <meta property="og:url" content="https://gpokharel.com/projects.html" />
  <meta property="og:image" content="https://gpokharel.com/assets/img/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/img/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Inter:wght@400;500;600&amp;display=swap" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <!-- Sets the slide direction for page transitions. It has to run before
       the page is first drawn, which is why it is here and not at the end. -->
  <script src="assets/js/motion.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main id="content">

    <!-- Page heading, with the All / Current / Past filter on the right.
         projects.js fills the filter and the grid from update/projects.json.
         The outer band spans the full width of the window so that dots.js
         can draw the dot grid behind it. -->
    <div class="dot-band" data-dots="projects">
      <section class="page-head container">
        <div>
          <h1>Projects</h1>
          <p class="page-lede">Work on AI, fairness and the allocation of scarce public resources. Current projects first, then past.</p>
        </div>
        <div id="project-filters" class="filters" role="group" aria-label="Filter projects by status"></div>
      </section>
    </div>

    <section class="band">
      <div class="container projects-main">
        <!-- Screen-reader-only announcement of filter results -->
        <p id="filter-status" class="visually-hidden" role="status"></p>

        <ul id="project-grid" class="project-grid"></ul>

        <!-- Shown only when the grid cannot render (fetch failure, no data) -->
        <p id="grid-note" class="muted" hidden></p>
      </div>
    </section>

  </main>
  <footer id="site-footer"></footer>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/projects.js"></script>
  <!-- The dot grid behind the page heading. Its on/off switches are at the
       top of the file. -->
  <script src="assets/js/dots.js"></script>
</body>
</html>
