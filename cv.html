<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV · Gaurab Pokharel</title>
  <meta name="description" content="Curriculum vitae of Gaurab Pokharel — education, experience, publications, talks, awards, service, and skills, with a downloadable PDF." />
  <link rel="icon" href="assets/img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:wght@500;600&display=swap" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/print.css" media="print" />
</head>
<body>
  <header id="site-header"></header>

  <main id="content">
    <div class="container cv-page">

      <!-- Print-only letterhead: the site header is hidden on paper, so the
           printed document carries the name here instead (see print.css). -->
      <div class="cv-print-header">
        <p class="cv-print-name">Gaurab Pokharel</p>
        <p class="cv-print-contact">Curriculum vitae · gpokharel.com</p>
      </div>

      <!-- Page heading with the PDF download action. cv.js re-points the
           button at whatever path data/cv.json declares in "pdf". -->
      <div class="cv-header">
        <h1>Curriculum vitae</h1>
        <a class="cv-download" href="assets/files/cv.pdf" download>
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M8 2v8" />
            <path d="M4.5 7 8 10.5 11.5 7" />
            <path d="M2.5 13.5h11" />
          </svg>
          Download PDF
        </a>
      </div>

      <p class="cv-updated" id="cv-updated" hidden></p>

      <!-- Filled by assets/js/cv.js from data/cv.json. -->
      <div id="cv-sections">
        <p class="cv-loading">Loading CV…</p>
      </div>

    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/site.js"></script>
  <script src="assets/js/cv.js"></script>
</body>
</html>
