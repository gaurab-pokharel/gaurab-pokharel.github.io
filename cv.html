<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV · Gaurab Pokharel</title>
  <meta name="description" content="Curriculum vitae of Gaurab Pokharel: education, publications, experience, talks, awards and service, with a downloadable PDF." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Gaurab Pokharel" />
  <meta property="og:title" content="CV · Gaurab Pokharel" />
  <meta property="og:description" content="Curriculum vitae of Gaurab Pokharel: education, publications, experience, talks, awards and service, with a downloadable PDF." />
  <meta property="og:url" content="https://gpokharel.com/cv.html" />
  <meta property="og:image" content="https://gpokharel.com/assets/img/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Inter:wght@400;500;600&amp;display=swap" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/print.css" media="print" />
</head>
<body>
  <header id="site-header"></header>
  <main id="content">

    <!-- Print-only letterhead: the site header is hidden on paper, so the
         printed document carries the name here instead (see print.css). -->
    <div class="cv-print-header container">
      <p class="cv-print-name">Gaurab Pokharel</p>
      <p class="cv-print-contact">Curriculum vitae · gpokharel.com</p>
    </div>

    <!-- Page heading with the PDF download. cv.js points the button at the
         path that update/cv.json declares in "pdf" and fills the date. -->
    <section class="page-head container">
      <div>
        <h1>Curriculum vitae</h1>
        <p class="page-lede" id="cv-updated" hidden></p>
      </div>
      <a class="btn cv-download" href="update/cv.pdf" download>Download PDF</a>
    </section>

    <!-- One band per section of update/cv.json, rendered by cv.js. The
         publication lists are filled from update/papers.json. -->
    <div id="cv-sections">
      <p class="page-note container">Loading CV…</p>
    </div>

  </main>
  <footer id="site-footer"></footer>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/cv.js"></script>
</body>
</html>
